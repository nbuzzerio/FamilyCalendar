# Include inside the existing www HTTPS server. Its http context supplies mime.types.
location = /apps/calendar {
    return 308 /apps/calendar/$is_args$args;
}
location ^~ /apps/calendar/. {
    return 404;
}
location = /apps/calendar/calendar.webmanifest {
    alias /var/www/family-calendar/current/calendar.webmanifest;
    open_file_cache off;
    types { }
    default_type application/manifest+json;
    expires -1;
}
location ^~ /apps/calendar/assets/ {
    alias /var/www/family-calendar/current/assets/;
    open_file_cache off;
    autoindex off;
    expires 365d;
}
location ^~ /apps/calendar/ {
    alias /var/www/family-calendar/current/;
    open_file_cache off;
    index index.html;
    autoindex off;
    expires -1;
    # The default maximum scope of sw.js is its own directory.
    # Inherit the canonical server's security headers.
}
